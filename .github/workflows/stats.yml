name: 瀏覽統計（GitHub Traffic）
on:
  schedule:
    - cron: '17 3 * * *'   # 每日 03:17 UTC = 11:17 +08
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 取瀏覽統計（Traffic API）並寫入 stats.json
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          # 修正點：github.token（自動 GITHUB_TOKEN）沒有 traffic 權限，
          # 必須用你自己建的 classic PAT（勾 repo scope），存成 repo secret TRAFFIC_TOKEN。
          set -o pipefail
          if ! curl -sf -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/views" -o /tmp/views.json; then
            echo "::error::traffic/views 失敗（401/403 通常是 token 沒權限，請確認 TRAFFIC_TOKEN 是 classic PAT 且有 repo scope）"
            exit 1
          fi
          if ! curl -sf -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/clones" -o /tmp/clones.json; then
            echo "::warning::traffic/clones 失敗（不影響主統計）"
            echo '{}' > /tmp/clones.json
          fi
          python3 - <<'EOF'
          import json, datetime
          v = json.load(open('/tmp/views.json')); c = json.load(open('/tmp/clones.json'))
          today = datetime.date.today().isoformat()
          cum = {"cumulative_visitors": 0, "last_counted_date": ""}
          try:
              old = json.load(open('stats.json', encoding='utf-8'))
              cum = {"cumulative_visitors": old.get("cumulative_visitors", 0),
                     "last_counted_date": old.get("last_counted_date", "")}
          except Exception:
              pass
          today_uniques = 0
          for d in v.get("views", []):
              if d["timestamp"][:10] == today:
                  today_uniques = d.get("uniques", 0); break
          if today != cum["last_counted_date"]:
              cum["cumulative_visitors"] += today_uniques
              cum["last_counted_date"] = today
          data = {
            "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "views_total": v.get("count", 0), "views_uniques": v.get("uniques", 0),
            "cumulative_visitors": cum["cumulative_visitors"],
            "last_counted_date": cum["last_counted_date"],
            "daily": [{"date": d["timestamp"][:10], "views": d["count"], "uniques": d["uniques"]}
                      for d in v.get("views", [])]
          }
          print("克隆（僅站主）:", c.get("count", 0), c.get("uniques", 0))
          json.dump(data, open('stats.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "更新瀏覽統計 $(date -u +%F)"
          git push
