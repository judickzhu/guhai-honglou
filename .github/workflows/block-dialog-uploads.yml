name: 阻擋對話記錄上傳（analysis）
# 用途：本站對話記錄「不上傳公開倉庫」。若有人把對話 md 推進 analysis/，
# 這個工作流會把它還原（既有檔）或刪除（新檔），並由 bot 推回。
# 只針對檔名含「对话／對話」的檔案，不影響正常的 analysis 研究筆記。
on:
  push:
    branches: [main]
    paths:
      - 'analysis/**对话*'
      - 'analysis/**對話*'
permissions:
  contents: write
jobs:
  revert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 還原（或刪除）對話記錄檔
        run: |
          set -e
          git fetch --depth=2 origin main
          changed=$(git diff --name-only HEAD~1 HEAD -- 'analysis/*对话*' 'analysis/*對話*' || true)
          if [ -z "$changed" ]; then echo "無對話記錄變更，略過"; exit 0; fi
          echo "偵測到對話記錄變更："
          echo "$changed"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if git cat-file -e "HEAD~1:$f" 2>/dev/null; then
              git checkout HEAD~1 -- "$f"
            else
              git rm -q --ignore-unmatch "$f"
            fi
          done <<< "$changed"
          git add -A
          if git diff --cached --quiet; then echo "無需提交"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "阻擋對話記錄上傳：還原／移除 analysis/ 下的對話檔"
          git push
